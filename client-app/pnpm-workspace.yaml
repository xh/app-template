# pnpm settings (pnpm 11+ reads these from this file, not from a `pnpm` field in package.json).
# This is a single-package project - the file exists for settings only, not to define a workspace.

# Dependency build scripts do not run unless reviewed here; unreviewed scripts are a hard error
# in CI. esbuild is allowed so its platform binary install is guaranteed for build tooling. The
# rest are declined: @parcel/watcher (via sass) ships prebuilt binaries, browser-tabs-lock (via auth0-spa-js) ships prebuilt dist, and core-js's
# postinstall only prints a funding message.
allowBuilds:
    '@parcel/watcher': false
    browser-tabs-lock: false
    core-js: false
    esbuild: true

# The build toolchain is owned by @xh/hoist-dev-utils, which depends on @rsbuild/core and drives it
# from its `configureRsbuild` export. Our `build` / `start` scripts invoke the `rsbuild` CLI by
# name, but pnpm only links bins for direct dependencies - so hoist it into the app's node_modules to
# put `rsbuild` on the script PATH. Preferred over re-declaring it as a direct devDependency of the
# app: that would fork the version from whatever dev-utils resolves, silently yielding two Rsbuild
# copies (the CLI's and the one dev-utils loads its plugins against) on any future dev-utils bump.
publicHoistPattern:
    - '@rsbuild/core'

# Keep pnpm-lock.yaml a single YAML document. By default pnpm 12 records the pinned pnpm version in
# a leading lockfile document, and GitHub's dependency graph reads only that first document - so it
# sees none of our real deps and Dependabot raises no security alerts. With `ignore`, pnpm runs
# whatever version is installed rather than switching to the `packageManager` pin. Remove once
# GitHub parses multi-document lockfiles - see
# https://github.com/dependabot/dependabot-core/issues/15904.
pmOnFail: ignore

# pnpm's minimum-release-age gate refuses freshly published versions as supply-chain protection.
# Exempt XH's own packages - hoist-react and hoist-dev-utils releases and SNAPSHOTs are routinely
# consumed minutes after publish.
minimumReleaseAgeExclude:
    - '@xh/*'

# Force a single copy of core-js: hoist-react depends on it at a broad range, so without an
# override the next minor resolves separately there and the bundle ships two sets of polyfills.
#
# When overriding a package that is also a direct dep, keep both specs identical:
#   - An override restating a broader range than the dep (`core-js: 3.x`) is a no-op - to dedupe
#     it must name the dep's own range.
#   - pnpm validates a lockfile against the override but `pnpm update` writes the raw package.json
#     specifier, so any divergence makes `pnpm update` emit a lockfile that
#     `pnpm install --frozen-lockfile` rejects (ERR_PNPM_OUTDATED_LOCKFILE). It only shows up in
#     CI - a local install with node_modules present skips the check and says "Already up to date".
catalog:
    core-js: ~3.51.0

overrides:
    core-js: 'catalog:'
    # Rspack 2.3.2 and 2.3.3 have SWC minifier bugs that break production builds. 2.3.2 breaks
    # classes that reference themselves in a static initializer. 2.3.3 leaves Highcharts charts
    # blank. Rsbuild's own range would otherwise resolve a broken version, so pin it here. Remove
    # once a fixed Rspack ships - see https://github.com/web-infra-dev/rspack/issues/16695.
    '@rspack/core': 2.3.1

# Several transitive deps (react-popper, react-onsenui, react-windowed-select) still declare
# react/react-dom peer ranges capped at 18. The app runs React 19 - acknowledge
# that here rather than surfacing unmet-peer warnings on every install.
#
# Vitest's mocker declares an msw 2 peer, but only Vitest's browser mode uses it there. Unit tests
# run on msw 3, as hoist-react's test kit requires.
peerDependencyRules:
    allowedVersions:
        react: '19'
        react-dom: '19'
        '@vitest/mocker>msw': '3'
