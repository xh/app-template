xhAppCode=hoistapp
xhAppName=Hoist App
xhAppPackage=io.xh.app
xhAppVersion=1.0-SNAPSHOT

# JDK major version for the Gradle Java toolchain (build.gradle). Keep the Tomcat base image in
# docker/tomcat/Dockerfile and the Java version in .github/workflows/ci.yml in sync with it.
majorJavaVersion=25

hoistCoreVersion=45.0.0
grailsVersion=8.0.0
dotEnvGradlePluginVersion=4.0.0

runHoistInline=false
enableHotSwap=false
localDevXmx=1G

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx1024M
