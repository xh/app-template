xhAppCode=hoistapp
xhAppName=Hoist App
xhAppPackage=io.xh.app
xhAppVersion=1.0-SNAPSHOT

# JDK major version used by both the Gradle Java toolchain (build.gradle) and the Tomcat runtime
# base image. Centralized here so a single edit covers both surfaces.
majorJavaVersion=21

hoistCoreVersion=41.0.0
grailsVersion=7.2.2
dotEnvGradlePluginVersion=4.0.0
hazelcast.version=5.7.0
opentelemetry.version=1.62.0

runHoistInline=false
enableHotSwap=false
localDevXmx=1G

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx1024M
